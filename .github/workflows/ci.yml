name: CampusConnect Microservices CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Test & Containerize Microservices
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - api-gateway
          - user-service
          - product-service
          - order-service

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: 📦 Install Dependencies (${{ matrix.service }})
        run: |
          cd ${{ matrix.service }}
          npm ci

      - name: 🧪 Run Automated Tests (${{ matrix.service }})
        run: |
          cd ${{ matrix.service }}
          npm test

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Docker Image (${{ matrix.service }})
        run: |
          docker build \
            -t campusconnect-${{ matrix.service }}:latest \
            -t campusconnect-${{ matrix.service }}:${{ github.sha }} \
            ./${{ matrix.service }}
