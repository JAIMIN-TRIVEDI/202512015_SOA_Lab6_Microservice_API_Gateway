apiVersion: v1
kind: Secret
metadata:
  name: campusconnect-secrets
  namespace: lab8
  labels:
    app.kubernetes.io/name: campusconnect
type: Opaque
stringData:
  # MongoDB Connection Strings (Atlas or Cluster DB)
  # Replace with your MongoDB Atlas connection string or keep default for in-cluster MongoDB
  MONGO_URI_USER: "mongodb://mongodb:27017/user_db"
  MONGO_URI_PRODUCT: "mongodb://mongodb:27017/product_db"
  MONGO_URI_ORDER: "mongodb://mongodb:27017/order_db"
